name: repairproof
description: Private repair handover, tracking and shop warranty management.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.6'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  get: ^4.7.3
  http: ^1.6.0
  uuid: ^4.6.0
  intl: ^0.20.3
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
